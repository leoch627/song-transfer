server {
    listen 80;
    listen [::]:80;
    server_name song.7227.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://song.7227.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name song.7227.org;

    ssl_certificate /etc/letsencrypt/live/song.7227.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/song.7227.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/songtransfer.access.log;
    error_log /var/log/nginx/songtransfer.error.log;
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
